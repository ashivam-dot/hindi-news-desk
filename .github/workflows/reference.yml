name: reference
# Once, after GEMINI_API_KEY is set: make the Gemini Sulafat reference clip the Chatterbox fallback clones, and commit
# it to main (tts/voices/sulafat_ref.wav and .json). Until it exists, a run without Gemini TTS holds.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: youtube
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('uv.lock', 'tts/uv.lock') }}
          restore-keys: models-
      - name: Install
        run: uv sync --frozen
      - name: Make the reference clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python tools/make_reference.py
      - name: Commit it
        run: |
          git add tts/voices/sulafat_ref.wav tts/voices/sulafat_ref.json
          git -c user.name="hindi-news-desk bot" -c user.email="335661989+ashivam-dot@users.noreply.github.com" \
            commit -q -m "voice: Sulafat reference clip for the Chatterbox fallback"
          git push -q origin HEAD:main
