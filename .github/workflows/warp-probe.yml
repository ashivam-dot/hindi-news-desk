name: warp-probe
on:
  workflow_dispatch:
    inputs:
      video:
        default: IOUExBZgm88
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null && uv sync --frozen
      - env:
          VIDEO: ${{ inputs.video }}
        run: uv run python scripts/clip_probe.py "$VIDEO"
