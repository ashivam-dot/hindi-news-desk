name: warp-probe
on:
  workflow_dispatch:
    inputs:
      video:
        default: IOUExBZgm88
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          VIDEO: ${{ inputs.video }}
        run: python scripts/warp_probe.py "$VIDEO"
